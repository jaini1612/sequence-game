services:
  - type: web
    name: sequence-server
    runtime: node
    plan: free
    rootDir: .
    # tsx (the start command's runner) is a devDependency, so it must be installed explicitly -
    # a plain `npm install` skips devDependencies whenever NODE_ENV=production.
    buildCommand: npm install --include=dev
    startCommand: npm run start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.5.0
      - key: CLIENT_ORIGIN
        sync: false
